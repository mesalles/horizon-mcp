[project]
name = "horizon-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing the HORIZON (Delta90) external attack-surface API to AI assistants"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Eloy Mesalles (Universitat Jaume I)", email = "mesalles@uji.es" }
]
requires-python = ">=3.13"
keywords = ["mcp", "horizon", "delta90", "elsa", "attack-surface", "easm", "rediris"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.2.3",
]

[project.urls]
Repository = "https://github.com/mesalles/horizon-mcp"

[project.scripts]
horizon-mcp = "horizon_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
